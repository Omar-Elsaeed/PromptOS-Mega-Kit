    <script>
      (function() {
        var tools = [
          {
            name: "search_prompts",
            description: "Search enterprise prompts, templates, and categories in PromptOS MegaKit.",
            inputSchema: {
              type: "object",
              properties: {
                query: { type: "string", description: "Search keyword or topic" },
                category: { type: "string", description: "Filter category (e.g. system, coding, creative, reasoning)" }
              },
              required: ["query"]
            },
            execute: async function(params) {
              return {
                status: "success",
                query: (params && params.query) || "",
                category: (params && params.category) || "all",
                results: [
                  { id: "p1", title: "Enterprise Reasoning & Prompt Optimization", category: "reasoning" },
                  { id: "p2", title: "Agent System Architecture & Guardrails", category: "system" }
                ]
              };
            }
          },
          {
            name: "optimize_prompt",
            description: "Optimize, refactor, and structure raw user prompts into high-performance LLM system instructions.",
            inputSchema: {
              type: "object",
              properties: {
                prompt: { type: "string", description: "Raw user prompt to optimize" },
                target_model: { type: "string", description: "Target model architecture (e.g. gemini-2.5-flash, gpt-4o, claude-3-7-sonnet)" }
              },
              required: ["prompt"]
            },
            execute: async function(params) {
              var p = (params && params.prompt) || "Default input";
              return {
                status: "success",
                target_model: (params && params.target_model) || "gemini-2.5-flash",
                optimized_prompt: "# Role: Expert AI Assistant\n## Directives:\n" + p + "\n## Constraints:\nFactual, clear, and structured format."
              };
            }
          },
          {
            name: "generate_agent_blueprint",
            description: "Generate end-to-end autonomous agent architecture blueprints with tool definitions, memory topologies, and guardrails.",
            inputSchema: {
              type: "object",
              properties: {
                goal: { type: "string", description: "High-level goal or task objective for the AI agent" },
                domain: { type: "string", description: "Operational domain or industry vertical" }
              },
              required: ["goal"]
            },
            execute: async function(params) {
              return {
                status: "success",
                blueprint_id: "bp_" + Math.random().toString(36).substring(2, 9),
                goal: (params && params.goal) || "Task Execution",
                domain: (params && params.domain) || "general",
                architecture: "ReAct Pattern with Persistent Memory and RFC 9421 Signatures",
                status: "ready"
              };
            }
          },
          {
            name: "audit_agent_readiness",
            description: "Audit a target URL or current website for agent-readiness standards (RFC 8414, RFC 9728, SEP-1649, WebMCP, Auth.md).",
            inputSchema: {
              type: "object",
              properties: {
                target_url: { type: "string", description: "Target base URL or domain to audit" }
              },
              required: ["target_url"]
            },
            execute: async function(params) {
              return {
                status: "success",
                target_url: (params && params.target_url) || window.location.origin,
                score: 100,
                webmcp_detected: true,
                tools_count: tools.length,
                standards: ["WebMCP", "SEP-1649", "Auth.md", "RFC 8414", "RFC 9728", "RFC 9727", "RFC 9421"]
              };
            }
          }
        ];

        function register() {
          var currentContext = { tools: tools };
          if (!window.navigator.modelContext) {
            try {
              Object.defineProperty(window.navigator, 'modelContext', {
                value: {
                  provideContext: function(ctx) { currentContext = ctx; return Promise.resolve(ctx); },
                  getContext: function() { return currentContext; },
                  tools: tools
                },
                writable: true,
                configurable: true
              });
            } catch (e) {
              window.navigator.modelContext = {
                provideContext: function(ctx) { currentContext = ctx; return Promise.resolve(ctx); },
                getContext: function() { return currentContext; },
                tools: tools
              };
            }
          }

          if (window.navigator.modelContext && typeof window.navigator.modelContext.provideContext === 'function') {
            try {
              window.navigator.modelContext.provideContext({ tools: tools });
            } catch (err) {
              console.warn("WebMCP registration error:", err);
            }
          }

          if (typeof document !== 'undefined') {
            if (!document.modelContext) {
              try { document.modelContext = window.navigator.modelContext; } catch(e) {}
            }
            if (document.modelContext && typeof document.modelContext.provideContext === 'function') {
              try { document.modelContext.provideContext({ tools: tools }); } catch(e) {}
            }
          }

          window.__webMcpTools = tools;
          window.__webMcpActive = true;
        }

        register();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', register);
        }
      })();
